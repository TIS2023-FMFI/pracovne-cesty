name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src

    services:
      # One MySQL server for both databases, as in production: user synchronisation joins them in one query.
      # The Pritomnost stand-in (dochadzka_testing) is created by the tests themselves.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: password
      PRITOMNOST_DB_HOST: 127.0.0.1
      PRITOMNOST_DB_PORT: 3306
      PRITOMNOST_DB_USERNAME: root
      PRITOMNOST_DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, gd, zip, bcmath
          coverage: none

      # Documents are printed with pdflatex; without it the export tests would only be skipped.
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern cm-super

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  style:
    name: Code style of changed files
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Older files do not follow the Pint preset yet, so do not make this a required check in the branch
    # protection until the code base has been formatted in one go: a finding then shows on the pull
    # request without blocking it.

    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check changed PHP files with Pint
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "origin/${BASE_REF}" > /dev/null
          mapfile -t files < <(git diff --relative --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files changed."
            exit 0
          fi
          ./vendor/bin/pint --test "${files[@]}"
